name: Apply STT push fallback compatibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply STT push fallback compatibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Hub compatibility
        shell: python
        run: |
          from pathlib import Path
          import json

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          old = '''def configure_stt_push(config: dict[str, Any]) -> dict[str, Any]:
              callback = f"http://{HUB_CALLBACK_HOST}:{HUB_PORT}/stt-event"
              url = manager.endpoint("stt", "/api/webhooks")
              response = requests.post(url, json={"urls": [callback]}, timeout=4)
              response.raise_for_status()
              data = response.json()
              if not data.get("ok", True):
                  raise RuntimeError(data.get("error") or "stt_push_config_failed")
              return {"ok": True, "callback": callback, "detail": data}
          '''.replace('          ', '')
          new = '''def configure_stt_push(config: dict[str, Any]) -> dict[str, Any]:
              """Register STT push when supported; gracefully fall back to V2.6 polling."""
              callback = f"http://{HUB_CALLBACK_HOST}:{HUB_PORT}/stt-event"
              url = manager.endpoint("stt", "/api/webhooks")
              try:
                  response = requests.post(url, json={"urls": [callback]}, timeout=4)
                  if response.status_code == 404:
                      health = {}
                      try:
                          health = requests.get(manager.endpoint("stt", "/health"), timeout=2).json()
                      except Exception:
                          pass
                      version = health.get("version") or "unknown"
                      return {
                          "ok": True,
                          "callback": callback,
                          "transport": "poll",
                          "fallback": True,
                          "warning": f"STT {version} không có /api/webhooks; dùng /api/result polling",
                          "health": health,
                      }
                  response.raise_for_status()
                  data = response.json()
                  if not data.get("ok", True):
                      raise RuntimeError(data.get("error") or "stt_push_config_failed")
                  return {"ok": True, "callback": callback, "transport": "push", "detail": data}
              except requests.RequestException as exc:
                  # If the STT HTTP service itself is online, polling remains a safe
                  # compatibility transport and prevents a version mismatch from
                  # aborting the whole pipeline.
                  try:
                      health = requests.get(manager.endpoint("stt", "/health"), timeout=2)
                      health.raise_for_status()
                      health_data = health.json()
                  except Exception:
                      raise exc
                  return {
                      "ok": True,
                      "callback": callback,
                      "transport": "poll",
                      "fallback": True,
                      "warning": f"STT push unavailable ({exc}); dùng /api/result polling",
                      "health": health_data,
                  }
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('configure_stt_push snippet not found')
          text = text.replace(old, new)

          old2 = '''    if str(config.get("stt_transport") or "push").lower() == "push":
              push = configure_stt_push(config)
              push["module"] = "stt-push"
              results.append(push)
          '''.replace('          ', '')
          new2 = '''    if str(config.get("stt_transport") or "push").lower() == "push":
              push = configure_stt_push(config)
              push["module"] = "stt-push"
              results.append(push)
              if push.get("fallback"):
                  config["stt_transport"] = "poll"
                  pipeline.enable_stt_polling(push.get("warning") or "STT push unavailable")
          '''.replace('          ', '')
          if old2 not in text:
              raise SystemExit('start_stt push snippet not found')
          text = text.replace(old2, new2)
          app.write_text(text, encoding='utf-8')

          pipeline = Path('core/pipeline.py')
          p = pipeline.read_text(encoding='utf-8')
          marker = '''    def _wait_stt_ready(self) -> bool:
          '''.replace('          ', '')
          method = '''    def enable_stt_polling(self, reason: str = "STT push unavailable") -> bool:
              """Switch an active STT pipeline to the V2.6 long-poll transport."""
              with self.lock:
                  self.config["stt_transport"] = "poll"
                  if not self.active or self.config.get("source") != "stt":
                      return False
                  if self.poll_thread and self.poll_thread.is_alive():
                      return True
                  self.stop_event.clear()
                  self.poll_thread = threading.Thread(
                      target=self._poll_stt,
                      daemon=True,
                      name="stt-poller-fallback",
                  )
                  self.poll_thread.start()
              self.log("config", f"STT transport: poll fallback · {reason}", stt_transport="poll")
              return True

          '''.replace('          ', '')
          if marker not in p:
              raise SystemExit('_wait_stt_ready marker not found')
          p = p.replace(marker, method + marker, 1)
          pipeline.write_text(p, encoding='utf-8')

          registry = Path('modules/registry.json')
          data = json.loads(registry.read_text(encoding='utf-8'))
          data['hub_version'] = '0.3.1'
          registry.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test = Path('.github/workflows/selftest.yml')
          t = test.read_text(encoding='utf-8')
          t = t.replace("assert data['hub_version'] == '0.3.0'", "assert data['hub_version'] == '0.3.1'")
          test.write_text(t, encoding='utf-8')

      - name: Compile patched Hub
        run: python -m py_compile app.py core/pipeline.py core/module_manager.py core/ports.py adapters/http_adapters.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py core/pipeline.py modules/registry.json .github/workflows/selftest.yml
          git commit -m "Apply STT push fallback compatibility"
          git push
