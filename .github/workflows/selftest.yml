name: Module Hub selftest

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py core/module_manager.py core/pipeline.py core/ports.py adapters/http_adapters.py
      - name: Validate registry
        shell: python
        run: |
          import json
          from pathlib import Path
          data = json.loads(Path('modules/registry.json').read_text(encoding='utf-8'))
          assert data['hub_version'] == '0.2.1'
          for module_id, item in data['modules'].items():
              assert item.get('port_env'), module_id
              assert item.get('health_path'), module_id
          print('REGISTRY_OK')
      - name: Test dynamic port allocator
        shell: python
        run: |
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from core.ports import PortAllocator
          allocator = PortAllocator()
          first = allocator.allocate('first')
          second = allocator.allocate('second')
          assert first != second
          assert allocator.get('first') == first
          allocator.release('first')
          assert allocator.get('first') is None
          external = 65500 if 65500 not in {first, second} else 65499
          allocator.attach('external', external)
          assert allocator.get('external') == external
          print('PORT_ALLOCATOR_OK', first, second, external)
      - name: Test stopped pipeline rejects intake before logging
        shell: python
        run: |
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from core.pipeline import PipelineEngine
          class DummyManager:
              pass
          pipeline = PipelineEngine(DummyManager())
          before = len(pipeline.events)
          result = pipeline.process_event({
              'eventType': 'comment',
              'payload': {'text': 'SHOULD_NOT_LOG'}
          })
          assert result['pipeline_active'] is False
          assert len(pipeline.events) == before
          print('STOPPED_PIPELINE_INTAKE_OK')
